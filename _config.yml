# Basic Site Settings
locale                   : "en-US"
site_theme               : "contrast" # Options: "default", "air", "sunrise", "mint", "dirt", "contrast"
title                    : "Jake Kim"
title_separator          : "-"
name                     : &name "Jake Kim"
description              : &description "Jake Kim - M.S. in Computer Science at UC San Diego"
url                      : https://jakecreate.github.io
baseurl                  : ""
repository               : "jakecreate/jakecreate.github.io"

# Site Author (Sidebar Profile)
author:
  # Biographic information
  avatar           : "/images/profile.png" # Replace /images/profile.png with your own photo
  name             : "Jake Kim"
  pronouns         : 
  bio              : "M.S. in Computer Science at UC San Diego"
  location         : "La Jolla, CA"
  employer         : "UC San Diego"
  uri              : 
  email            : "developjake@gmail.com" 

  # Academic websites (left blank so icons stay hidden)
  academia         : 
  arxiv            : 
  googlescholar    : 
  inspire-hep      : 
  impactstory      : 
  orcid            : 
  semantic         : 
  ssrn             : 
  pubmed           : 
  researchgate     : 
  scopus           : 
  zotero           : 

  # Repositories and software development
  bitbucket        : 
  codepen          : 
  dribbble         : 
  github           : "jakecreate"
  kaggle           : 
  stackoverflow    : 

  # Social media
  artstation       : 
  bluesky          : 
  facebook         : 
  flickr           : 
  foursquare       : 
  goodreads        : 
  google_plus      : 
  keybase          : 
  instagram        : 
  lastfm           : 
  linkedin         : "jake-j-kim"
  mastodon         : 
  medium           : 
  pinterest        : 
  soundcloud       : 
  steam            : 
  telegram         : 
  tumblr           : 
  twitter          : 
  vine             : 
  weibo            : 
  wikipedia        : 
  xing             : 
  youtube          : 
  zhihu            : 

# Site Settings
teaser                   : 
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false

atom_feed:
  hide                   : true # Hides the RSS feed icon in the footer since you aren't blogging
  path                   : 

# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# Social Sharing
twitter:
  username               : &twitter
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : 
og_description           : 
social:
  type                   : 
  name                   : 
  links: 

# Analytics
analytics:
  provider               : "false"
  google:
    tracking_id          :

# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
  # Excluded unused template sections:
  # Excluded unused template sections:
  - _posts
  - _teaching
  - _publications
  - _portfolio
  - _talks
  - _pages/cv.md
  - _pages/cv-json.md
  - _pages/markdown.md
  - _pages/year-archive.html
  - _pages/publications.html
  - _pages/talks.html
  - _pages/teaching.html
  - _pages/portfolio.html
  - _pages/talkmap.html
  - _pages/archive-layout-with-content.md
  - _pages/category-archive.html
  - _pages/collection-archive.html
  - _pages/page-archive.html
  - _pages/tag-archive.html

keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections (Set output: false so Jekyll doesn't generate pages for these)
# collections:
#   teaching:
#     output: false
#     permalink: /:collection/:path/
#   publications:
#     output: false
#     permalink: /:collection/:path/
#   portfolio:
#     output: false
#     permalink: /:collection/:path/
#   talks:
#     output: false
#     permalink: /:collection/:path/

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: America/Los_Angeles

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development